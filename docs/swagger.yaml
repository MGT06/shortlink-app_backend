basePath: /
definitions:
  dto.CreateLinkRequest:
    properties:
      original_url:
        type: string
      slug:
        type: string
    required:
    - original_url
    type: object
  dto.ErrorResponse:
    properties:
      message:
        example: error
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  dto.Response:
    properties:
      message:
        example: success
        type: string
      results: {}
      success:
        example: true
        type: boolean
    type: object
host: localhost:5050
info:
  contact: {}
  description: This is a sample server celler server.
  title: ShortLink APP
  version: "1.0"
paths:
  /api/links:
    post:
      consumes:
      - application/json
      parameters:
      - description: Link
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Create a Short Link
      tags:
      - link
  /api/links/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: id link
        in: path
        name: linkId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Delete a Short Link
      tags:
      - link
  /api/login:
    post:
      consumes:
      - application/json
      description: Login using email and password
      parameters:
      - description: Login
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/register:
    post:
      consumes:
      - application/json
      description: Register Account
      parameters:
      - description: Register
        in: body
        name: newAccount
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register
      tags:
      - auth
securityDefinitions:
  BearerToken:
    description: Bearer token used as identitiy for access resource
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
